<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fb">
  <meta name="description" content="MSC Volunteer HQ – eine unabhängige Konzeptdemo mit fiktiven Beispieldaten.">
  <title>MSC Volunteer HQ · Konzeptdemo</title>
  <style>
    :root {
      --bg:#f4f7fb; --card:#fff; --soft:#ebf0f6; --navy:#071f42;
      --muted:#526176; --line:#d6dfea; --accent:#12518b; --warning:#a65c00;
      --radius:10px; --app-width:480px; --shadow:0 3px 10px #071f4206;
    }
    * { box-sizing:border-box; }
    html { background:#e9eef4; color:var(--navy); }
    body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button,a,input,select,textarea,summary { -webkit-tap-highlight-color:transparent; }
    button { cursor:pointer; }
    button,a { touch-action:manipulation; }
    button { overflow-wrap:anywhere; }
    a { color:var(--accent); }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible { outline:3px solid #83afe0; outline-offset:3px; }
    button:disabled { opacity:.55; cursor:default; }
    p { margin:0; }
    h1,h2,h3 { margin:0; line-height:1.15; letter-spacing:-.04em; font-weight:850; }
    h1 { font-size:clamp(27px,7.4vw,33px); }
    h2 { font-size:22px; }
    h3 { font-size:17px; }
    svg { display:block; }
    .icon { width:20px; height:20px; flex-shrink:0; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .app { width:100%; max-width:var(--app-width); min-height:100vh; min-height:100dvh; margin:auto; background:var(--bg); position:relative; box-shadow:0 0 50px #071f4209; }
    .app-header { position:sticky; top:0; z-index:15; background:#f4f7fbf5; border-bottom:1px solid var(--line); backdrop-filter:blur(12px); padding:17px 18px 9px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .brand-lockup { display:flex; gap:7px; align-items:center; }
    .brand-mark { font-size:30px; line-height:1; font-weight:950; letter-spacing:-2px; }
    .brand-name { font-size:6.5px; font-weight:850; letter-spacing:.6px; line-height:1.2; text-transform:uppercase; }
    .brand-divider { width:1px; height:26px; background:#8c9fb8; }
    .brand-title { font-size:11px; letter-spacing:.12em; font-weight:750; }
    .draft-tag { margin-left:auto; border:1px solid #a4b6cd; border-radius:3px; padding:3px 5px; font-size:9px; letter-spacing:.07em; }
    .header-meta { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:9px; color:var(--muted); font-size:10px; }
    .demo-switch { display:inline-flex; gap:5px; align-items:center; border:0; background:none; padding:3px 0 3px 8px; font-size:10px; min-height:28px; color:var(--muted); }
    .demo-switch .icon { width:13px; height:13px; }
    main { padding:20px 18px calc(100px + env(safe-area-inset-bottom)); }
    .page { animation:appear .18s ease; }
    .page-head { position:relative; margin-bottom:18px; }
    .page-head .eyebrow { margin-bottom:7px; }
    .page-head p { color:var(--muted); margin-top:5px; font-size:14px; }
    .eyebrow,.field-label { font-size:10px; line-height:1.4; letter-spacing:.11em; text-transform:uppercase; font-weight:650; color:#496381; }
    .eyebrow { display:block; margin-bottom:7px; }
    .section-label { margin:18px 2px 8px; }
    .section-title { font-size:20px; margin:20px 2px 10px; }
    .muted { color:var(--muted); }
    .small { font-size:12px; }
    .tiny { font-size:10px; }
    .stack { display:grid; gap:10px; }
    .card { border:1px solid var(--line); background:var(--card); border-radius:var(--radius); padding:14px; box-shadow:var(--shadow); min-width:0; }
    .soft { background:var(--soft); box-shadow:none; }
    .row { display:flex; align-items:center; gap:10px; min-width:0; }
    .between { justify-content:space-between; }
    .grow { flex:1; min-width:0; }
    .button { border:1px solid var(--navy); border-radius:7px; min-height:44px; padding:10px 12px; background:white; display:inline-flex; align-items:center; justify-content:center; gap:8px; font-size:13px; font-weight:650; text-decoration:none; line-height:1.35; }
    .button.primary { background:var(--navy); color:white; }
    .button.subtle { border-color:var(--line); background:transparent; }
    .button.danger { border-color:#e4caca; color:#9c3434; }
    .button.full { width:100%; }
    .button.compact { padding:8px 10px; font-size:12px; }
    .button .icon { width:18px; height:18px; }
    .button-pair { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:9px; }
    .text-button { display:inline-flex; align-items:center; gap:6px; padding:8px 0; border:0; background:transparent; font-size:12px; font-weight:650; color:var(--accent); text-align:left; min-height:40px; }
    .text-button .icon { width:16px; height:16px; }
    .back { display:inline-flex; align-items:center; gap:4px; border:0; padding:0; min-height:30px; background:transparent; font-size:12px; margin:-8px 0 8px; }
    .back .icon { width:15px; height:15px; }
    .pill { display:inline-flex; align-items:center; gap:5px; border:1px solid #aabdd3; border-radius:50px; padding:4px 10px; font-size:11px; background:#ffffff80; }
    .badge { display:inline-block; border:1px solid #aabdd3; border-radius:4px; padding:3px 7px; font-size:11px; font-weight:550; }
    .entry { width:100%; display:flex; align-items:center; gap:12px; border:1px solid var(--line); border-radius:var(--radius); padding:12px 13px; background:white; text-align:left; min-width:0; box-shadow:var(--shadow); }
    .entry strong { display:block; font-size:13px; line-height:1.35; font-weight:750; }
    .entry .subtitle { display:block; color:var(--muted); font-size:11px; margin-top:3px; }
    .entry>.icon:last-child { width:16px; height:16px; }
    .entry-icon { width:31px; min-width:31px; height:34px; display:grid; place-items:center; }
    .entry-icon.tinted { background:#eef4fa; border-radius:6px; }
    .nav { position:fixed; z-index:20; width:100%; max-width:var(--app-width); left:50%; transform:translateX(-50%); bottom:0; background:#ffffffed; backdrop-filter:blur(16px); border-top:1px solid var(--line); display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:3px; padding:5px 7px calc(6px + env(safe-area-inset-bottom)); }
    .nav button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:0; background:transparent; min-height:58px; padding:5px 1px; border-radius:9px; font-size:10px; }
    .nav .icon { width:23px; height:23px; }
    .nav button.active { background:#e4eef8; font-weight:750; }
    .nav button.active .icon { stroke-width:2.2; }
    .page-footer { text-align:center; margin:13px 0 0; font-size:9px; color:#687e98; }
    .welcome { position:relative; isolation:isolate; padding:5px 0 15px; margin-bottom:3px; }
    .welcome h1 { font-size:clamp(26px,7vw,31px); }
    .welcome p { margin:4px 0 10px; font-size:13px; }
    .welcome .architecture { position:absolute; z-index:-1; width:160px; height:245px; right:-4px; top:-53px; opacity:.29; pointer-events:none; filter:grayscale(1) contrast(2.8) brightness(1.5); mix-blend-mode:multiply; mask-image:linear-gradient(to bottom,transparent 0%,black 12%,black 76%,transparent 100%); }
    .shift { padding:15px; }
    .shift-time { font-size:clamp(31px,9vw,41px); line-height:1.05; letter-spacing:-.055em; font-weight:900; margin:6px 0 3px; }
    .shift h2 { font-size:26px; }
    .shift-location { font-size:12px; color:var(--muted); margin:8px 0 13px; }
    .shift-location .icon { color:var(--accent); width:17px; height:17px; }
    .shift-actions { padding-top:12px; border-top:1px solid var(--line); }
    .update-dot { width:12px; height:12px; border-radius:50%; background:#48a3df; flex:none; margin:0 8px 0 2px; }
    .portrait { flex:none; overflow:hidden; width:58px; height:58px; border-radius:50%; background:#e2ebf1; }
    .portrait svg { width:100%; height:100%; object-fit:cover; }
    .person-home { gap:11px; }
    .person-home h3 { font-size:17px; }
    .person-home .button { margin-left:auto; }
    .person-home .muted { font-size:11px; }
    .field { display:grid; gap:6px; min-width:0; }
    input:not([type="radio"]),select,textarea { width:100%; min-width:0; min-height:44px; border:1px solid #b8cce1; border-radius:8px; background:white; padding:11px 12px; font-size:16px; line-height:1.45; }
    textarea { resize:vertical; min-height:108px; }
    input::placeholder,textarea::placeholder { color:#73859e; opacity:1; }
    .search { position:relative; margin:12px 0; }
    .search .icon { position:absolute; left:13px; top:13px; }
    .search input { padding-left:41px; }
    .segments { display:flex; border:1px solid #b8cce1; border-radius:8px; background:white; overflow:hidden; }
    .segments button { flex:1; min-width:0; min-height:42px; border:0; border-right:1px solid var(--line); background:transparent; display:flex; align-items:center; justify-content:center; gap:7px; padding:9px 5px; font-size:12px; line-height:1.25; }
    .segments button:last-child { border-right:0; }
    .segments button.active { background:var(--navy); color:white; }
    .segments .icon { width:18px; height:18px; }
    .floor-tabs { display:flex; justify-content:center; gap:10px; margin:12px 0 4px; }
    .floor-tabs button { width:75px; min-height:38px; background:white; border:1px solid #b8cce1; border-radius:7px; font-size:12px; }
    .floor-tabs button.active { background:var(--navy); color:white; border-color:var(--navy); }
    .venue-map { position:relative; min-width:0; margin:8px -8px 0; }
    .iso-map { height:340px; position:relative; }
    .iso-level { position:absolute; top:calc(var(--order) * 96px + 5px); left:28px; right:0; height:135px; opacity:.38; transition:opacity .18s; }
    .iso-level.active { opacity:1; z-index:3; }
    .iso-level svg { width:100%; height:135px; }
    .floor-label { position:absolute; top:calc(var(--order) * 96px + 69px); left:0; padding:1px 0 3px; font-size:11px; font-weight:600; border:0; border-bottom:1px solid #a2b8cf; background:none; min-width:29px; }
    .floor-label.active { color:var(--accent); font-weight:850; }
    .map-pin { position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%); display:inline-flex; align-items:center; gap:3px; color:var(--navy); background:white; border:1px solid #b8cadc; border-radius:6px; padding:5px 7px; font-size:10px; font-weight:650; box-shadow:0 4px 9px #071f4218; white-space:nowrap; min-height:36px; }
    .map-pin .icon { width:17px; height:20px; fill:var(--navy); stroke:white; }
    .map-pin.selected { color:white; background:var(--navy); border-color:var(--navy); }
    .plan-map { height:260px; position:relative; margin:13px 0 4px; }
    .plan-map>svg { width:100%; height:250px; }
    .map-caption { text-align:right; color:#687e98; font-size:9px; margin:0 1px 12px; }
    .poi-detail h2 { font-size:24px; margin:1px 0 5px; }
    .poi-detail p { font-size:13px; color:var(--muted); }
    .poi-detail .row { margin:9px 0 12px; font-size:12px; }
    .search-results { display:grid; gap:7px; margin:-4px 0 12px; }
    .empty { border:1px dashed #b8cce1; border-radius:8px; padding:18px 14px; text-align:center; color:var(--muted); font-size:12px; }
    .contact-feature { display:flex; gap:13px; padding:12px; }
    .contact-feature .portrait { width:110px; height:165px; border-radius:6px; }
    .contact-feature h3 { font-size:19px; }
    .contact-feature .person-role { font-size:12px; color:var(--muted); margin:3px 0 7px; }
    .contact-feature .person-purpose { font-size:12px; line-height:1.5; }
    .contact-feature .location-label { display:block; font-size:9px; color:#496381; margin:7px 0; }
    .contact-feature .button-pair { gap:6px; }
    .contact-feature .button { font-size:10px; padding:6px; gap:4px; min-height:38px; }
    .contact-feature .button .icon { width:14px; height:14px; }
    .contact-entry { padding:0; overflow:hidden; }
    .contact-entry .portrait { width:76px; height:80px; border-radius:0; }
    .contact-entry .grow { padding:9px 0; }
    .contact-entry>.icon { margin-right:12px; }
    .info { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:12px; font-size:11px; }
    .chips { display:flex; flex-wrap:wrap; gap:5px; margin:9px 0 0; }
    .chip { min-height:37px; padding:7px 9px; border:1px solid #bccfe2; border-radius:25px; background:white; display:flex; align-items:center; gap:5px; font-size:10px; }
    .chip .icon { width:15px; height:15px; }
    .chip.active { background:var(--navy); border-color:var(--navy); color:white; }
    details.faq-item { padding:0; }
    .faq-item summary { list-style:none; display:flex; justify-content:space-between; align-items:center; gap:10px; padding:13px; font-weight:750; font-size:13px; cursor:pointer; min-height:48px; }
    .faq-item summary::-webkit-details-marker { display:none; }
    .faq-item summary .icon { width:15px; height:15px; }
    .faq-item[open] summary .icon { transform:rotate(180deg); }
    .faq-body { padding:0 13px 11px; font-size:12px; color:var(--muted); }
    .faq-actions { display:flex; flex-wrap:wrap; gap:16px; margin:5px 0 3px; }
    .faq-meta { padding-top:8px; border-top:1px solid var(--line); display:flex; flex-wrap:wrap; justify-content:space-between; gap:3px; font-size:9px; color:#647b98; }
    .support-card { margin-top:13px; }
    .support-card .row { align-items:flex-start; margin-bottom:9px; }
    .support-card .icon { width:30px; height:30px; }
    .support-card strong { padding-top:2px; font-size:13px; }
    .steps { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); margin:16px -5px 18px; }
    .step { position:relative; text-align:center; background:none; border:0; padding:0; font-size:11px; color:var(--muted); }
    .step:before { content:""; position:absolute; top:14px; left:50%; width:100%; height:1px; background:#bccfe2; }
    .step:last-child:before { display:none; }
    .step-number { position:relative; z-index:1; display:grid; place-items:center; width:28px; height:28px; margin:0 auto 4px; border-radius:50%; border:1px solid #b9cce0; background:var(--bg); font-size:13px; }
    .step.active { font-weight:750; color:var(--navy); }
    .step.active .step-number { border:2px solid var(--navy); box-shadow:inset 0 0 0 3px var(--bg); background:var(--navy); color:transparent; }
    .step.done .step-number { background:var(--navy); border-color:var(--navy); color:white; }
    .expense-summary .eyebrow { margin:0; }
    .expense-total { font-size:32px; font-weight:850; line-height:1.25; letter-spacing:-.04em; margin:3px 0; }
    .expense-status { display:flex; align-items:center; gap:5px; font-size:10px; margin-top:4px; color:var(--accent); }
    .expense-status .icon { width:14px; height:14px; }
    .expense-status.missing { color:var(--warning); }
    .expense-amount { font-weight:750; font-size:14px; white-space:nowrap; }
    .upload { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border:1px dashed #637f9f; border-radius:8px; min-height:78px; background:transparent; padding:12px; width:100%; font-size:12px; cursor:pointer; text-align:center; }
    .upload .icon { width:25px; height:25px; }
    .upload .file-input { position:absolute; width:1px; height:1px; min-height:0; padding:0; border:0; opacity:0; overflow:hidden; }
    .upload:focus-within { outline:3px solid #83afe0; outline-offset:3px; }
    .save-status { display:flex; justify-content:center; align-items:center; gap:6px; color:#687e98; font-size:10px; margin-top:10px; }
    .save-status .icon { width:14px; height:14px; }
    .receipt-card { display:grid; gap:9px; }
    .receipt-card .button-pair { grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
    .receipt-preview { max-width:100%; max-height:290px; object-fit:contain; margin:10px auto; border-radius:7px; }
    .review-row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; font-size:12px; border-bottom:1px solid var(--line); }
    .review-row strong { white-space:nowrap; }
    .review-total { border-bottom:0; padding-top:14px; font-size:16px; font-weight:750; }
    .feedback-head { isolation:isolate; }
    .feedback-head .elephant { position:absolute; right:-9px; top:-53px; width:165px; height:218px; object-fit:contain; opacity:.19; z-index:-1; pointer-events:none; }
    .form-stack { display:grid; gap:17px; margin-top:19px; }
    .counter { font-size:10px; color:#496381; text-align:right; margin-top:1px; }
    .radio-option { border:1px solid #bdcfe2; border-radius:8px; background:white; display:flex; align-items:center; gap:12px; padding:10px 12px; min-height:60px; }
    .radio-option:has(input:checked) { border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); }
    .radio-option input { accent-color:var(--navy); width:18px; height:18px; margin:0; flex:none; }
    .radio-option strong { display:block; font-weight:600; font-size:12px; }
    .radio-option small { color:var(--muted); font-size:10px; }
    .help-line { display:flex; align-items:center; gap:8px; padding:8px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:16px 0 12px; font-size:11px; }
    .help-line .text-button { margin-left:auto; font-size:10px; }
    .rating { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; }
    .rating button { border:1px solid #bdcfe2; border-radius:8px; padding:10px 2px; background:white; font-size:10px; display:grid; justify-items:center; gap:5px; min-height:70px; }
    .rating button.active { border-color:var(--navy); background:#e5eef8; box-shadow:inset 0 0 0 1px var(--navy); }
    .rating .icon { width:27px; height:27px; }
    .error { border-left:3px solid #a7423a; padding:9px 11px; background:#fbefed; color:#8d342d; font-size:12px; border-radius:4px; margin-bottom:13px; }
    .notice { padding:11px 12px; background:#f7f1e6; border:1px solid #e6d8bc; border-radius:8px; font-size:12px; color:#835500; }
    .success { padding:22px 15px; text-align:center; }
    .success>.icon { width:36px; height:36px; margin:0 auto 12px; color:var(--accent); }
    .success p { margin:9px 0 15px; color:var(--muted); font-size:12px; }
    .success .tiny { margin-top:12px; }
    .admin-item { padding:14px; }
    .admin-item .row { align-items:flex-start; }
    .admin-item p { margin:8px 0; color:var(--muted); font-size:12px; }
    .modal-layer { position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center; background:#071f4270; padding-top:30px; }
    .modal { width:100%; max-width:var(--app-width); background:var(--bg); padding:20px 18px calc(22px + env(safe-area-inset-bottom)); border-radius:18px 18px 0 0; max-height:92vh; max-height:92dvh; overflow-y:auto; box-shadow:0 -8px 40px #071f4218; }
    .modal-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:18px; }
    .modal-head h2 { font-size:22px; }
    .icon-button { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--line); border-radius:50%; background:white; flex:none; }
    .modal .form-stack { margin-top:0; }
    .profile-portrait { width:86px; height:105px; border-radius:9px; }
    .profile-copy { margin:14px 0; font-size:13px; }
    .contact-data { overflow-wrap:anywhere; }
    .toast { position:fixed; z-index:60; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); width:calc(100% - 36px); max-width:420px; color:white; background:var(--navy); border-radius:9px; padding:12px 14px; box-shadow:0 7px 24px #071f4230; font-size:12px; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

    .mini-portrait { width:36px; height:36px; border-radius:50%; }
    .spatial-map { position:relative; width:100%; }
    .ground-detail { aspect-ratio:3 / 2; margin:8px 0 15px; }
    .overview-detail { aspect-ratio:2 / 3; }
    .venue-art { display:block; width:100%; height:100%; object-fit:contain; }
    .plan-detail { aspect-ratio:600 / 380; }
    .plan-detail>svg { width:100%; height:100%; }
    .map-pin.compact-pin { background:transparent; border:0; box-shadow:none; padding:6px; min-width:44px; min-height:44px; justify-content:center; overflow:visible; white-space:normal; }
    .pin-dot { display:grid; place-items:center; width:27px; height:27px; background:#071f42df; border:2px solid white; color:white; font-size:11px; font-weight:750; border-radius:50%; box-shadow:0 2px 6px #071f4230; }
    .selected .pin-dot { background:var(--navy); outline:2px solid #7398bd; outline-offset:1px; }
    .pin-label { position:absolute; top:calc(100% - 4px); left:50%; transform:translateX(var(--label-shift,-50%)); background:white; border:1px solid var(--line); padding:4px 7px; border-radius:5px; font-size:10px; color:var(--navy); white-space:nowrap; box-shadow:0 2px 5px #071f4212; }

  function contactsPage() { return `<section class="page">${head('Wer hilft dir weiter?','Die richtige Person für dein Anliegen.')}<div class="search">${icon('search')}<input type="search" data-input="contact-search" aria-label="Name, Rolle oder Anliegen suchen" value="${esc(ui.contactQuery)}" placeholder="Name oder Thema suchen"></div><div class="segments" aria-label="Kontakte filtern">${[['all','Alle'],['team','Mein Team'],['org','Organisation']].map(([id,label])=>`<button data-contact-filter="${id}" class="${ui.contactFilter===id?'active':''}" aria-pressed="${ui.contactFilter===id}">${label}</button>`).join('')}</div><div id="contact-results" aria-live="polite">${contactList()}</div><div class="info">${icon('info')}<span>Unsicher? Volunteer Support hilft dir weiter.</span></div></section>`; }

  function faqPage() { return `<section class="page">${head('Was möchtest du wissen?','Antworten für deinen Volunteer-Einsatz.','Field Guide')}<div class="search">${icon('search')}<input type="search" data-input="faq-search" aria-label="FAQ durchsuchen" placeholder="Frage oder Stichwort eingeben" value="${esc(ui.faqQuery)}"></div><div class="chips" aria-label="FAQ-Kategorien">${[['Ankunft','plane'],['Einsatz','users'],['Zugang','calendar'],['Reisekosten','file']].map(([c,i])=>`<button class="chip ${ui.faqCategory===c?'active':''}" data-faq-category="${c}" aria-pressed="${ui.faqCategory===c}">${icon(i)}${c}</button>`).join('')}</div><h2 class="section-title">${ui.faqQuery||ui.faqCategory!=='all'?'Passende Fragen':'Häufige Fragen'}</h2><div id="faq-results" class="stack" aria-live="polite">${faqList()}</div><article class="card support-card"><div class="row">${icon('chat')}<strong>Deine Frage ist noch offen?</strong></div><button class="button primary full" data-contact="anna">Volunteer Support kontaktieren ${icon('arrow')}</button></article></section>`; }

  function travelStep() { return `<form id="trip-form" class="stack"><article class="card"><span class="eyebrow">Deine Beispielreise</span><h2 style="margin-bottom:15px">Ankommen in München</h2><div class="stack"><label class="field"><span class="field-label">Abreiseort</span><input name="origin" required maxlength="80" value="${esc(state.trip.origin)}" autocomplete="off"></label><label class="field"><span class="field-label">Reiseziel</span><input name="destination" required maxlength="80" value="${esc(state.trip.destination)}" autocomplete="off"></label><label class="field"><span class="field-label">Anreise</span><input type="date" name="start" required value="${esc(state.trip.start)}"></label><label class="field"><span class="field-label">Rückreise</span><input type="date" name="end" required value="${esc(state.trip.end)}"></label></div></article><button class="button primary full" type="submit">Weiter zu Kosten ${icon('arrow')}</button></form>`; }

  function costStep() { return `<article class="card expense-summary"><div class="row between"><span class="eyebrow">Bisher erfasst</span><span class="badge">${state.submitted?'Eingereicht · Demo':'Entwurf'}</span></div><div class="expense-total">${euro(total())}</div><p class="muted tiny">Beispielbeträge · ${state.submitted?'Lokal als eingereicht markiert':'Noch nicht eingereicht'}</p></article><h2 class="section-title">Deine Kosten</h2><div class="stack">${state.expenses.length?state.expenses.map(e=>`<button class="entry" data-expense="${e.id}"><span class="entry-icon tinted">${icon(e.category==='Bahn'?'train':'file')}</span><span class="grow"><strong>${esc(e.title)}</strong>${receiptStatus(e)}</span><span class="expense-amount">${euro(e.cents)}</span>${icon('right')}</button>`).join(''):'<div class="empty">Noch keine Kosten erfasst. Füge deine erste Ausgabe hinzu.</div>'}<button class="button full" data-action="add-expense">${icon('plus')}Kosten hinzufügen</button><button class="upload" data-expense-step="receipts">${icon('camera')}Beleg fotografieren oder hochladen</button><button class="button primary full" data-expense-step="receipts">Weiter zu Belege ${icon('arrow')}</button></div>`; }
  function receiptStep() {

ass="field-label">Was möchtest du ergänzen? (Optional)</span><textarea data-feedback="comment" maxlength="500" placeholder="Was würde dir heute helfen?">${esc(f.comment)}</textarea></label>`:`<label class="field"><span class="field-label">Wem möchtest du Danke sagen?</span><select data-feedback="thanksTo">${contacts.map(c=>`<option value="${c.id}" ${f.thanksTo===c.id?'selected':''}>${c.name}</option>`).join('')}</select></label><label class="field"><span class="field-label">Deine Nachricht</span><textarea data-feedback="thanks" required maxlength="500" placeholder="Danke, dass du …">${esc(f.thanks)}</textarea></label>`}<button class="button primary full" type="submit">${icon(f.mode==='thanks'?'heart':'send')}${f.mode==='feedback'?'Feedback senden':f.mode==='checkin'?'Check-in speichern':'Danke senden'}</button></form>`;

  function showModal(title,body) {

  function submitExpenses() {
    ui.expenseError='';
    if(!state.trip.origin.trim()||!state.trip.destination.trim()||!state.trip.start||!state.trip.end||state.trip.end<state.trip.start) { state.expenseStep='travel';ui.expenseError='Bitte vervollständige die Reise und prüfe die Reisedaten.'; }
    else if(!state.expenses.length||state.expenses.some(e=>!e.title.trim()||e.cents<=0)) { state.expenseStep='costs';ui.expenseError='Bitte erfasse mindestens eine vollständige Kostenposition.'; }
    else if(state.expenses.some(e=>!e.receipt)) { state.expenseStep='receipts';ui.expenseError='Bitte ergänze die fehlenden Belege, bevor du die Demo einreichst.'; }
    else { state.submitted=true;state.expenseStep='review';save();toast('Deine Reisekosten wurden lokal als eingereicht markiert.'); }
    render();
  }
  function sendFeedback() {
    const f=state.feedback;ui.feedbackError='';
    if(f.mode==='feedback'&&f.text.trim().length<10)ui.feedbackError='Beschreibe dein Anliegen bitte mit mindestens 10 Zeichen.';
    if(f.mode==='checkin'&&!f.rating)ui.feedbackError='Wähle eine Bewertung von 1 bis 5.';
    if(f.mode==='thanks'&&f.thanks.trim().length<3)ui.feedbackError='Schreibe bitte eine kurze Danke-Nachricht.';
    if(!ui.feedbackError) {
      f.sent=true;
      const content=f.mode==='feedback'?{category:f.category,text:f.text,privacy:f.privacy}:f.mode==='checkin'?{rating:f.rating,comment:f.comment}:{thanksTo:f.thanksTo,thanks:f.thanks};
      const anonymous=f.mode==='feedback'&&f.privacy==='anon';
      state.feedbackHistory.push({id:'f'+Date.now(),mode:f.mode,...content,name:anonymous?null:'Moritz',team:anonymous?null:state.team});save();
    }
    render();
  }
  function resetDemo() { showModal('Demo zurücksetzen?',`<p class="muted small" style="margin-bottom:16px">Deine lokal angelegten Briefings, Kosten und Beiträge werden durch die ursprünglichen Beispieldaten ersetzt.</p><div class="stack"><button class="button danger full" data-action="confirm-reset">Zurücksetzen</button><button class="button full" data-action="close-modal">Abbrechen</button></div>`); }
  document.addEventListener('click',event=>{
    const button=event.target.closest('button');if(!button)return;
    if(button.dataset.nav) { if(button.dataset.nav==='admin'){state.mode='admin';save();}go(button.dataset.nav);return; }
    if(button.dataset.poi) { openPoi(button.dataset.poi);return; }
    if(button.dataset.contact) { showContact(button.dataset.contact);return; }
    if(button.dataset.contactDetails) { contactDetails(button.dataset.contactDetails);return; }
    if(button.dataset.floor) { selectFloor(button.dataset.floor);return; }
    if(button.dataset.briefing) { showBriefing(button.dataset.briefing);return; }
    if(button.dataset.expense) { expenseDialog(button.dataset.expense);return; }
    if(button.dataset.expenseStep) { state.expenseStep=button.dataset.expenseStep;ui.expenseError='';save();render();return; }
    if(button.dataset.deleteExpense) { const id=button.dataset.deleteExpense;state.expenses=state.expenses.filter(e=>e.id!==id);if(previews.has(id))URL.revokeObjectURL(previews.get(id));previews.delete(id);freshDraft();closeModal();save();render();toast('Kostenposition gelöscht.');return; }
    if(button.dataset.contactFilter) { ui.contactFilter=button.dataset.contactFilter;document.querySelectorAll('[data-contact-filter]').forEach(el=>{el.classList.toggle('active',el.dataset.contactFilter===ui.contactFilter);el.setAttribute('aria-pressed',el.dataset.contactFilter===ui.contactFilter);});document.getElementById('contact-results').innerHTML=contactList();return; }
    if(button.dataset.faqCategory) { ui.faqCategory=ui.faqCategory===button.dataset.faqCategory?'all':button.dataset.faqCategory;render();return; }
    if(button.dataset.faqLink) { const r=button.dataset.faqLink;if(r==='lead')showContact(lead());else if(contacts.some(c=>c.id===r))showContact(r);else if(place(r))openPoi(r);else go(r);return; }
    if(button.dataset.feedbackMode) { state.feedback.mode=button.dataset.feedbackMode;state.feedback.sent=false;ui.feedbackError='';save();render();return; }
    if(button.dataset.rating) { state.feedback.rating=Number(button.dataset.rating);save();document.querySelectorAll('[data-rating]').forEach(el=>{el.classList.toggle('active',Number(el.dataset.rating)===state.feedback.rating);el.setAttribute('aria-pressed',Number(el.dataset.rating)===state.feedback.rating);});return; }
    if(button.dataset.editBriefing) { briefingDialog(button.dataset.editBriefing);return; }
    switch(button.dataset.action) {
      case 'close-modal': closeModal();break;
      case 'demo-settings':demoSettings();break;
      case 'map-view': state.venue.view=button.dataset.view;save();render();break;
      case 'map-sources':showModal('Pläne und Bildquellen',`<div class="stack"><p class="small">Das Erdgeschoss orientiert sich an den öffentlichen Hotelplänen von 2025. Die 3D-Darstellung ist vereinfacht; aktuelle Zugangssituationen werden nicht behauptet. Obergeschosse, Venue B, Volunteer-Zuordnungen und alle D-Raumkennungen sind frei erfundene Beispiele.</p><p class="small"><a href="https://www.bayerischerhof.de/media/Hotel_Bayerischer_Hof/Downloads/Veranstaltungen/HBH_Konferenzbroschuere_DE_2025.pdf" target="_blank" rel="noopener noreferrer">Offizielle Konferenzbroschüre des Bayerischen Hofs</a></p><p class="small"><a href="https://www.bayerischerhof.de/media/Hotel_Bayerischer_Hof/Eine_Welt_fuer_sich/Aktuelles/HBH_Orientierungsplan_Umbau2025__V2.pdf" target="_blank" rel="noopener noreferrer">Öffentlicher Orientierungsplan 2025 (Umbauphase)</a></p><p class="small">Porträts: unveränderte Ausschnitte deiner Design-Screenshots. Frauenkirche: historischer, auf Wikimedia Commons als gemeinfrei ausgewiesener Aufriss. Etagenmodelle und Elefant: generierte Bildassets.</p><p class="small"><a href="https://commons.wikimedia.org/wiki/File:Frauenkirche_M%C3%BCnchen_Aufrisse_vor_1900.jpg" target="_blank" rel="noopener noreferrer">Bildquelle Frauenkirche</a></p></div>`);break;
      case 'clear-faq':ui.faqQuery='';ui.faqCategory='all';render();break;
      case 'add-expense':expenseDialog();break;
      case 'submit-expenses':submitExpenses();break;
      case 'new-feedback':state.feedback.sent=false;state.feedback.text='';state.feedback.comment='';state.feedback.thanks='';state.feedback.rating=0;save();render();break;
      case 'new-briefing':briefingDialog();break;
      case 'improvements':showModal('Ihr habt gesagt. Wir haben geändert.',`<span class="eyebrow">Fiktive Verbesserungsbeispiele</span><div class="stack"><article class="card"><h3>Die Anlaufstelle leichter finden</h3><p class="small muted" style="margin-top:6px">„Am Treppenaufgang fehlt ein Hinweis.“ – Im Beispiel wurde dort ein gut sichtbares Schild zum Volunteer Desk ergänzt.</p></article><article class="card"><h3>Änderungen an einem Ort</h3><p class="small muted" style="margin-top:6px">„Treffpunkt-Änderungen gehen unter.“ – Tageshinweise stehen jetzt gesammelt im persönlichen Briefing.</p></article><article class="card"><h3>Pausen besser abstimmen</h3><p class="small muted" style="margin-top:6px">„Ich weiß nicht, wann ich Pause machen kann.“ – Im Beispiel klärt das Team die Pausen bei der Übergabe.</p></article></div>`);break;
      case 'reset':resetDemo();break;
      case 'confirm-reset': for(const url of previews.values())URL.revokeObjectURL(url);previews.clear();state=initial();Object.assign(ui,{venueQuery:'',contactQuery:'',contactFilter:'all',faqQuery:'',faqCategory:'all',expenseError:'',feedbackError:''});save();closeModal();go('home');toast('Die Beispieldaten sind wiederhergestellt.');break;
    }
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.dataset.input==='venue-search') { ui.venueQuery=el.value;document.getElementById('venue-results').innerHTML=venueResults(); }
    if(el.dataset.input==='contact-search') { ui.contactQuery=el.value;document.getElementById('contact-results').innerHTML=contactList(); }
    if(el.dataset.input==='faq-search') { ui.faqQuery=el.value;document.getElementById('faq-results').innerHTML=faqList(); }
    if(el.dataset.feedback) { state.feedback[el.dataset.feedback]=el.value;state.feedback.sent=false;save();const counter=document.getElementById('feedback-counter');if(counter)counter.textContent=state.feedback.text.length+'/500'; }
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.dataset.change==='poi') { openPoi(el.value); }
    if(el.dataset.change==='building') { const b=buildings[el.value];state.venue={...state.venue,building:el.value,floor:'EG',poi:b.pois[0].id};ui.venueQuery='';history.replaceState(null,'','#venue/'+state.venue.poi);save();render(); }
    if(el.dataset.feedback) { state.feedback[el.dataset.feedback]=el.value;save(); }
    if(el.dataset.receipt) {
      const file=el.files?.[0];if(!file)return;
      if(!['image/jpeg','image/png','image/webp','application/pdf'].includes(file.type)) { toast('Bitte wähle JPG, PNG, WebP oder PDF.');el.value='';return; }
      if(file.size>8*1024*1024||file.size===0) { toast(file.size===0?'Die gewählte Datei ist leer.':'Der Beleg darf höchstens 8 MB groß sein.');el.value='';return; }
      const e=state.expenses.find(e=>e.id===el.dataset.receipt);if(!e)return;
      if(previews.has(e.id))URL.revokeObjectURL(previews.get(e.id));
      previews.set(e.id,URL.createObjectURL(file));e.receipt={name:file.name,type:file.type,size:file.size,example:false};freshDraft();save();render();toast('Beleg zugeordnet. Es wurde keine Datei hochgeladen.');
    }
  });
  document.addEventListener('submit',event=>{
    const form=event.target;event.preventDefault();
    if(form.id==='trip-form') { const data=new FormData(form);if(data.get('end')<data.get('start')){ui.expenseError='Die Rückreise darf nicht vor der Anreise liegen.';render();return;}state.trip=Object.fromEntries(data);freshDraft();state.expenseStep='costs';save();render(); }
    if(form.id==='expense-form') {
      const data=new FormData(form),title=String(data.get('title')).trim(),amount=String(data.get('amount')).trim().replace(',','.'),cents=Math.round(Number(amount)*100);
      if(!title||!/^\d+(\.\d{1,2})?$/.test(amount)||!Number.isSafeInteger(cents)||cents<=0||cents>10000000) { const error=document.getElementById('expense-form-error');error.className='error';error.textContent='Bitte gib eine Bezeichnung und einen gültigen Betrag über 0 EUR ein (maximal zwei Nachkommastellen).';return; }
      const existing=state.expenses.find(e=>e.id===form.dataset.id);if(existing)Object.assign(existing,{title,cents,category:data.get('category')});else state.expenses.push({id:'e'+Date.now(),title,cents,category:data.get('category'),receipt:null});freshDraft();state.expenseStep='costs';save();closeModal();render();
    }
    if(form.id==='feedback-form')sendFeedback();
    if(form.id==='briefing-form') { const data=new FormData(form),title=String(data.get('title')).trim(),text=String(data.get('text')).trim();if(!title||!text){toast('Bitte ergänze Titel und Nachricht.');return;}const b={id:form.dataset.id||'b'+Date.now(),title,text,audience:data.get('audience'),status:data.get('status'),date:new Date().toLocaleDateString('de-DE')},index=state.briefings.findIndex(item=>item.id===b.id);if(index>=0)state.briefings.splice(index,1);state.briefings.unshift(b);save();closeModal();render();toast(b.status==='published'?'Briefing veröffentlicht.':'Briefing als Entwurf gespeichert.'); }
    if(form.id==='demo-form') { const data=new FormData(form);state.mode=data.get('mode');state.team=data.get('team');save();go(state.mode==='admin'?'admin':'home'); }
  });
  document.addEventListener('keydown',event=>{
    const modal=document.querySelector('.modal');if(!modal)return;
    if(event.key==='Escape') { event.preventDefault();closeModal(); }
    if(event.key==='Tab') { const focusable=Array.from(modal.querySelectorAll('button,input,select,textarea,a[href]')).filter(el=>!el.disabled),first=focusable[0],last=focusable[focusable.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();} }
  });
  window.addEventListener('hashchange',()=>{closeModal();render();});
  window.addEventListener('pagehide',()=>{for(const url of previews.values())URL.revokeObjectURL(url);previews.clear();});
  if(!location.hash)history.replaceState(null,'','#home');
  render();
  save();
})();
</script>
</body>
</html>
